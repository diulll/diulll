name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # -----------------------------------------------
      # TAHAP 1: Bikin Gambar STREAK (Api) Saja
      # -----------------------------------------------
      - name: Generate Streak
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.TOKEN_ULAR }}
          filename: metrics-streak.svg
          user: diulll
          template: classic
          config_timezone: Asia/Jakarta
          
          # Matikan base (header, dll) biar cuma muncul Streak
          base: ""
          plugin_streak: yes
          plugin_streak_mode: weekly
      
      # -----------------------------------------------
      # TAHAP 2: Bikin Gambar STATS (Umum) Saja
      # -----------------------------------------------
      - name: Generate Stats Umum
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.TOKEN_ULAR }}
          filename: metrics-stats.svg
          user: diulll
          template: classic
          config_timezone: Asia/Jakarta
          
          # Nyalakan base info saja
          base: header, activity, community, repositories
          plugin_lines: yes
